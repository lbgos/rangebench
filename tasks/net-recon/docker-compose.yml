services:
  web:
    image: nginx:1.27-alpine
  decoy-ssh:
    image: alpine:3.20
    command: sh -c 'while true; do echo "SSH-2.0-OpenSSH_9.6p1 Debian-3"; sleep 1; done | nc -l -p 22'
  db:
    image: alpine:3.20
    command: sh -c 'while true; do echo "postgres 15.6 ready for connections"; sleep 1; done | nc -l -p 5432'
  flagsvc:
    image: alpine:3.20
    entrypoint: >
      sh -c 'FLAG="flag{$$(head -c16 /dev/urandom | od -An -tx1 | tr -d " \n")}";
      echo "$$FLAG" > /flag;
      chmod 400 /flag;
      while true; do
      printf "SRVSTAT v2.1.3 | node=lab-mon-07 | services=ok | token=%s\n" "$$FLAG" | nc -l -p 31337;
      done'
networks:
  default:
    internal: true
