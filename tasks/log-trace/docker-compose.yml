services:
  baker:
    image: python:3.12-alpine
    volumes:
      - incident:/srv
    entrypoint: >
      sh -c 'FLAG="flag{$$(head -c16 /dev/urandom | od -An -tx1 | tr -d " \n")}";
      echo "$$FLAG" > /flag;
      chmod 400 /flag;
      python3 /gen.py "$$FLAG" /srv/auth.log /srv/syslog;
      sleep infinity'
    configs:
      - source: gen
        target: /gen.py
configs:
  gen:
    file: gen.py
volumes:
  incident: {}
networks:
  default:
    internal: true
